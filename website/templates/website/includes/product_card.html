<a href="{% url 'shop_detail' product.slug %}" class="group flex h-full flex-col rounded-[28px] border border-neutral-100 bg-white p-6 text-right shadow-card transition duration-300 ease-out hover:-translate-y-1 hover:border-sabz/30 hover:shadow-card-hover">
  <div class="mb-5 flex items-center justify-between gap-4">
    <span class="rounded-full bg-gold-soft px-3 py-1 text-xs font-extrabold text-sabz">{{ product.get_kind_display }}</span>
    <span class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-gold text-sabz transition duration-300 group-hover:scale-105">
      {% include "website/includes/product_icon.html" with kind=product.kind %}
    </span>
  </div>
  <h2 class="text-xl font-extrabold leading-8">{{ product.title }}</h2>
  <p class="mt-3 flex-1 text-sm leading-7 text-neutral-600">{{ product.summary }}</p>
  <p class="mt-4 text-xs font-bold text-neutral-500">{{ product.unit }}</p>
  <p class="mt-1 text-lg font-extrabold text-sabz">{{ product.price_display }} <span class="text-xs font-bold text-neutral-500">تومان</span></p>
  <span class="mt-5 inline-flex w-fit rounded-xl bg-sabz px-5 py-2.5 text-sm font-extrabold text-white">درخواست خرید</span>
</a>
