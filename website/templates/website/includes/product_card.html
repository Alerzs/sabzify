{% load static %}
<a href="{% url 'shop_detail' product.slug %}" class="group flex h-full flex-col overflow-hidden rounded-2xl border border-neutral-100 bg-white text-right shadow-card transition duration-300 ease-out hover:-translate-y-1 hover:border-sabz/30 hover:shadow-card-hover">
  {% if product.image %}
  <img src="{% static product.image %}" alt="{{ product.title }}" class="block h-auto w-full">
  {% else %}
  <div class="grid h-28 place-items-center bg-neutral-50">
    <span class="grid h-10 w-10 place-items-center rounded-full bg-gold text-sabz">
      {% include "website/includes/product_icon.html" with kind=product.kind %}
    </span>
  </div>
  {% endif %}
  <div class="flex flex-1 flex-col p-3">
    <span class="mb-1.5 w-fit rounded-full bg-gold-soft px-2 py-0.5 text-[11px] font-extrabold text-sabz">{{ product.get_kind_display }}</span>
    <h2 class="text-sm font-extrabold leading-6">{{ product.title }}</h2>
    <p class="mt-1 line-clamp-2 flex-1 text-xs leading-5 text-neutral-600">{{ product.summary }}</p>
    <p class="mt-2 text-[11px] font-bold text-neutral-500">{{ product.unit }}</p>
    <p class="text-sm font-extrabold text-sabz">{{ product.price_display }} <span class="text-[11px] font-bold text-neutral-500">تومان</span></p>
    <span class="mt-2.5 inline-flex w-fit rounded-lg bg-sabz px-3 py-1.5 text-xs font-extrabold text-white">درخواست خرید</span>
  </div>
</a>
