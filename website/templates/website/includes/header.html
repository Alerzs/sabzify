{% load static %}
<header class="relative z-30 mx-auto w-full max-w-6xl px-4 pt-5">
  <div class="mb-4 flex items-center justify-between gap-4">
    <a href="{% url 'home' %}" class="flex items-center gap-3 text-white">
      <span class="grid h-12 w-12 place-items-center rounded-2xl bg-gold text-sabz shadow-md">
        <svg viewBox="0 0 24 24" class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 19c8-1 13-8 14-15-7 1-14 5-14 15z"/>
          <path stroke-linecap="round" d="M8.5 15.5c2.2-2.4 4.8-4.2 8-5.2"/>
        </svg>
      </span>
      <span class="text-2xl font-extrabold tracking-tight">سبزیفای</span>
    </a>

    <div class="hidden items-center gap-6 md:flex">
      <a href="tel:{{ SITE_PHONE_TEL }}" class="flex items-center gap-3">
        <span class="text-left">
          <span class="block text-xs font-bold text-gold">شماره تماس</span>
          <span class="block text-sm font-extrabold text-white">{{ SITE_PHONE }}</span>
        </span>
        <span class="grid h-12 w-12 place-items-center rounded-xl bg-gold text-sabz">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 3h3l1.5 4-2 1.5a12 12 0 0 0 6 6L17 13l4 1.5V18a2 2 0 0 1-2 2A15 15 0 0 1 4 5a2 2 0 0 1 2-2z"/>
          </svg>
        </span>
      </a>
      <div class="flex items-center gap-3">
        <span class="max-w-[180px] text-left">
          <span class="block text-xs font-bold text-gold">آدرس دفتر ما</span>
          <span class="block text-xs font-semibold leading-5 text-white">{{ SITE_ADDRESS }}</span>
        </span>
        <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-gold text-sabz">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
            <circle cx="12" cy="10" r="2.2"/>
          </svg>
        </span>
      </div>
    </div>
  </div>

  <nav class="rounded-2xl bg-white px-3 py-3 text-neutral-800 shadow-nav">
    <div class="flex items-center justify-between gap-3">
      <div class="hidden items-center gap-1 lg:flex">
        {% include "website/includes/nav_links.html" %}
      </div>

      <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-xl bg-neutral-100 lg:hidden" aria-label="باز کردن منو" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <div class="flex items-center gap-2">
        <a href="https://instagram.com" class="hidden h-10 w-10 place-items-center rounded-lg bg-gold/20 text-sabz sm:grid" aria-label="اینستاگرام">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://t.me" class="hidden h-10 w-10 place-items-center rounded-lg bg-gold/20 text-sabz sm:grid" aria-label="تلگرام">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor"><path d="M20.7 4.3 3.8 10.8c-1.1.4-1.1 1.1-.2 1.4l4.3 1.3 10-6.3c.5-.3.9-.1.5.2l-8.1 7.3-.3 4.4c.4 0 .6-.2.9-.5l2.1-2 4.4 3.2c.8.5 1.4.2 1.6-.8l2.9-13.6c.3-1.2-.4-1.7-1.2-1.3z"/></svg>
        </a>
        <a href="{% url 'request' %}" class="rounded-xl bg-gold px-4 py-2.5 text-sm font-extrabold text-neutral-900 transition hover:bg-gold-soft">ثبت درخواست</a>
      </div>
    </div>

    <div id="mobile-menu" class="mt-3 hidden border-t border-neutral-100 pt-3 lg:hidden">
      <div class="grid gap-1">
        {% include "website/includes/nav_links.html" %}
      </div>
    </div>
  </nav>
</header>
